# Checks every pull request, and every push to main, for correctness,
# dependencies and security. Formatting and style are not judged.
#
# Nothing here publishes or keeps anything: the token can only read the
# repository, no secret is passed in, and no cache is written. A pull request
# runs its own copy of this file and of deny.toml, so a change to either is
# read before its result is trusted. Merging stays a person's decision; no
# result here merges or blocks anything.
#
#   test     compiles and runs the tests on Linux, on x86_64 and on arm64;
#            fails if Cargo.lock is out of step with Cargo.toml
#   android  compiles the crate for Android on arm64, its C parts built by
#            the NDK's compiler
#   msrv     checks that the crate compiles on the Rust that Cargo.toml's
#            rust-version names, the oldest it promises to build on
#   clippy   correctness lints only, the ones for code that cannot be right
#   deny     sources, bans and licences fail the run (deny.toml); RustSec
#            advisories are reported as a warning and never fail it
#
# dannesk-xrpl-codec and dannesk-noise-protocol are tested in their own
# repositories.
#
# Actions are pinned to a commit rather than a tag or branch, which their
# owners can move. Updating one is a deliberate edit.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The runner image ships rustup; this brings stable up to date.
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Test
        run: cargo test --locked

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android

      # The runner image ships the Android NDK. Its clang compiles the C in
      # aws-lc, secp256k1 and zstd for API level 26 (Android 8.0), the oldest
      # Android the app supports.
      - name: Check
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo check --locked --target aarch64-linux-android

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$v" --profile minimal --no-self-update
          rustup default "$v"

      - name: Check
        run: cargo check --locked

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable

      # Only clippy's correctness group: code that cannot be right, such as
      # `x == x` or a loop that always exits on its first pass. Its style,
      # complexity and performance lints are switched off, not left as
      # warnings.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -A clippy::all -D clippy::correctness

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # cargo-deny's own release build, checked against its published SHA-256.
      - name: Install cargo-deny
        run: |
          v=0.20.2
          f=cargo-deny-$v-x86_64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/$f.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$v/$f.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/$f.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$f" >> "$GITHUB_PATH"

      - name: Sources, bans and licences
        run: cargo deny --locked check sources bans licenses

      # An advisory can land on a crate long after it entered Cargo.lock, so
      # this reports and never fails. Between runs, Dependabot alerts report
      # new vulnerabilities in Cargo.lock.
      - name: Advisories (reported, never failing)
        if: ${{ !cancelled() }}
        run: |
          cargo deny --locked check advisories && exit 0
          echo "::warning title=RustSec advisories::cargo-deny reports an advisory against Cargo.lock; see this step's log."
