[package]
name = "dannesk-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Communication layer"
repository = "https://github.com/Dannesk/dannesk-core"
publish = false

[dependencies]
# Our MIT crates, each in its own repository, pinned to a commit until they
# are on crates.io.
dannesk-xrpl-codec = { git = "https://github.com/Dannesk/dannesk-xrpl-codec", rev = "6923f5c0fb9c84ce4b55a6768c4a15accb8a4f9e" }
dannesk-btc-codec = { git = "https://github.com/Dannesk/dannesk-btc-codec", rev = "74a94be6df08135deaaffe36f1b3b693584594a1" }
dannesk-noise-protocol = { git = "https://github.com/Dannesk/dannesk-noise-protocol", rev = "dedaad4d2d1bff66d7639c43f0fc3c2cf3316b30", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
socket2 = { version = "0.6.5", features = ["all"] }  # TCP keepalive and user timeout on the app's socket
tungstenite = { version = "0.30.0", default-features = false }  # its Message type alone: the frames queued for the socket
uuid = { version = "1.29.3", features = ["v4"] }
zeroize = { version = "1.9.2", features = ["derive", "serde"] }
aes-gcm = "0.11.1"
rand = "0.10.4"
base64 = "0.23.1"
argon2 = "0.6.0"
sha2 = "0.11.2"
ripemd = "0.2.0"
bs58 = { version = "0.5.1", features = ["check"] }
hex = "0.4.3"
zstd = "0.14.5"
region = "4.0.2"
libc = "0.2.191"
