[package]
name = "dannesk-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Communication layer"
repository = "https://github.com/Dannesk/dannesk-core"
publish = false

[dependencies]
# Our MIT crates, each in its own repository, pinned to a commit until they
# are on crates.io.
dannesk-xrpl-codec = { git = "https://github.com/Dannesk/dannesk-xrpl-codec", rev = "4aa3822b8355f27cd45f793871a3af946329c60f" }
dannesk-btc-codec = { git = "https://github.com/Dannesk/dannesk-btc-codec", rev = "f206fd8c19c10fb49b9629f100a7a1888dd1ad2e" }
dannesk-noise-protocol = { git = "https://github.com/Dannesk/dannesk-noise-protocol", rev = "99984ac5b5db50834d0c1f2154546c219015bfba", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.3", features = ["full"] }
socket2 = { version = "0.6.5", features = ["all"] }  # TCP keepalive and user timeout on the app's socket
tungstenite = { version = "0.30.0", default-features = false }  # its Message type alone: the frames queued for the socket
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = { version = "1.9", features = ["derive", "serde"] }
aes-gcm = "0.11.1"
rand = "0.10.3"
base64 = "0.23.1"
argon2 = "0.6.0"
sha2 = "0.11.0"
ripemd = "0.2.0"
bs58 = { version = "0.5.1", features = ["check"] }
hex = "0.4.3"
zstd = "0.14.0"
region = "4.0.1"
libc = "0.2.190"
