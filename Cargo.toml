[package]
name = "dannesk-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Communication layer"
repository = "https://github.com/Dannesk/dannesk-core"
publish = false

[dependencies]
# Our MIT crates, each in its own repository, pinned to a commit until they
# are on crates.io.
dannesk-xrpl-codec = { git = "https://github.com/Dannesk/dannesk-xrpl-codec", rev = "7a9243bce1905fedcac38b986e0e321c52db4c1f" }
dannesk-btc-codec = { git = "https://github.com/Dannesk/dannesk-btc-codec", rev = "5c4fe7bc359288cb61180cd1566ebbee7a9b32c0" }
dannesk-noise-protocol = { git = "https://github.com/Dannesk/dannesk-noise-protocol", rev = "6d7671a7e45b3e7d07c0716c1fcf6bf03dbab220", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tungstenite = { version = "0.30.0", default-features = false }  # its Message type alone: the frames queued for the socket
uuid = { version = "1.27.0", features = ["v4"] }
zeroize = { version = "1.9", features = ["derive", "serde"] }
aes-gcm = "0.11.1"
rand = "0.10.3"
base64 = "0.23.1"
argon2 = "0.6.0"
sha2 = "0.11.0"
ripemd = "0.2.0"
bs58 = { version = "0.5.1", features = ["check"] }
hex = "0.4.3"
zstd = "0.14.0"
region = "4.0.1"
libc = "0.2.190"
